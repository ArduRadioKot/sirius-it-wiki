<svg xmlns="http://www.w3.org/2000/svg" width="790" height="310" viewBox="0 0 790 310" role="img" aria-labelledby="title desc">
  <title id="title">Формы государственного устройства</title>
  <desc id="desc">Унитарное государство: один центр и административные единицы. Федерация: центр и субъекты со своими органами и разграничением полномочий. Конфедерация: независимые государства объединяются по договору для общих задач.</desc>
