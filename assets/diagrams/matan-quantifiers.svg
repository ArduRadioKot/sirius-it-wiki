<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Кванторы</title><desc id="desc">Для всех и существует на конечном множестве</desc><rect width="1000" height="440" fill="#fbfaf6"/>
<text x="45" y="58" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#17243c" text-anchor="start">Два квантора</text>
<text x="45" y="91" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#546276" text-anchor="start">Область X = {1, 2, 3, 4}</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546276"/></marker></defs>
<circle cx="145" cy="235" r="45" fill="#e4eefb" stroke="#315fc0" stroke-width="3"/>
<text x="145" y="245" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#17243c" text-anchor="middle">1</text>
<circle cx="320" cy="235" r="45" fill="#e4eefb" stroke="#315fc0" stroke-width="3"/>
<text x="320" y="245" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#17243c" text-anchor="middle">2</text>
<circle cx="495" cy="235" r="45" fill="#e4eefb" stroke="#315fc0" stroke-width="3"/>
<text x="495" y="245" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#17243c" text-anchor="middle">3</text>
<circle cx="670" cy="235" r="45" fill="#e4eefb" stroke="#315fc0" stroke-width="3"/>
<text x="670" y="245" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#17243c" text-anchor="middle">4</text>
<rect x="65" y="325" width="400" height="70" rx="18" fill="#e1f3f0" stroke="none" stroke-width="2"/>
<rect x="515" y="325" width="420" height="70" rx="18" fill="#fdebe7" stroke="none" stroke-width="2"/>
<text x="90" y="369" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#137e87" text-anchor="start">∀x ∈ X: x &gt; 0  ✓</text>
<text x="540" y="369" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#d35943" text-anchor="start">∃x ∈ X: x = 3  ✓</text>
</svg>