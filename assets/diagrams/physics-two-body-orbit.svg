<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Два тела вращаются вокруг общего центра масс</title><desc id="desc">Расстояния R1 и R2 складываются в расстояние r между телами; силы притяжения направлены друг к другу</desc><rect width="1000" height="470" fill="#fbfaf6"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<text x="42" y="60" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#17243c" text-anchor="start">Два тела и общий центр масс</text>
<text x="42" y="95" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#546276" text-anchor="start">Одинаковые период и угловая скорость; разные радиусы орбит</text>
<line x1="115" y1="255" x2="900" y2="255" stroke="#c5d1cf" stroke-width="3" stroke-linecap="round"/>
<circle cx="300" cy="255" r="34" fill="#e4eefb" stroke="#315fc0" stroke-width="3"/>
<circle cx="780" cy="255" r="48" fill="#e1f3f0" stroke="#137e87" stroke-width="3"/>
<circle cx="595" cy="255" r="9" fill="#d35943" stroke="none" stroke-width="2"/>
<text x="300" y="265" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#17243c" text-anchor="middle">M₁</text>
<text x="780" y="264" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#17243c" text-anchor="middle">M₂</text>
<text x="595" y="302" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#d35943" text-anchor="middle">O</text>
<line x1="300" y1="210" x2="595" y2="210" stroke="#315fc0" stroke-width="3" stroke-linecap="round"/>
<line x1="595" y1="210" x2="780" y2="210" stroke="#137e87" stroke-width="3" stroke-linecap="round"/>
<text x="448" y="194" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#315fc0" text-anchor="middle">R₁</text>
<text x="688" y="194" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#137e87" text-anchor="middle">R₂</text>
<line x1="339" y1="276" x2="558" y2="276" stroke="#315fc0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="737" y1="292" x2="629" y2="292" stroke="#137e87" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="205" y="355" width="590" height="68" rx="18" fill="#e4eefb" stroke="none" stroke-width="2"/>
<text x="500" y="400" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#17243c" text-anchor="middle">r = R₁ + R₂     •     M₁R₁ = M₂R₂</text>
</svg>