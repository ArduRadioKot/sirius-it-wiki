<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Центральная симметрия как смена знака вектора</title>
  <desc id="desc">Точки A и A штрих лежат по разные стороны от центра O на равном расстоянии. Векторы OA и OA штрих противоположны.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 8 4.5 1 8" fill="none" stroke="#315b63" stroke-width="1.6"/></marker></defs>
  <rect width="760" height="340" rx="22" fill="#f0f9fb"/>
  <text x="380" y="40" text-anchor="middle" fill="#173c43" font-family="Arial,sans-serif" font-size="21" font-weight="700">Центр — середина отрезка AA′</text>
  <path d="M135 275 625 65" stroke="#a7bfc3" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M380 170 182 255" stroke="#7e6fc6" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M380 170 578 85" stroke="#0b7d86" stroke-width="5" marker-end="url(#arrow)"/>
  <circle cx="182" cy="255" r="8" fill="#7e6fc6"/><circle cx="380" cy="170" r="8" fill="#173c43"/><circle cx="578" cy="85" r="8" fill="#0b7d86"/>
  <g fill="#173c43" font-family="Arial,sans-serif" font-size="22" font-weight="700"><text x="145" y="285">A</text><text x="360" y="205">O</text><text x="593" y="87">A′</text></g>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700"><text x="260" y="175" fill="#7e6fc6">x</text><text x="495" y="180" fill="#0b7d86">−x</text></g>
  <text x="380" y="312" text-anchor="middle" fill="#536d73" font-family="Arial,sans-serif" font-size="17">OA = OA′ · A, O, A′ лежат на одной прямой</text>
</svg>
