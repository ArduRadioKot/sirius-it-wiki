  <path d="M426.0 206.0 A34 34 0 0 0 416.0 230.0" stroke="#0b7d86" stroke-width="2.2" fill="none"/>
  <text x="119.8" y="221.5" fill="#0b7d86" font-family="Arial,sans-serif" font-size="18" font-weight="700" font-style="italic" text-anchor="middle">α</text>
  <text x="402.0" y="216.4" fill="#0b7d86" font-family="Arial,sans-serif" font-size="18" font-weight="700" font-style="italic" text-anchor="middle">β</text>
