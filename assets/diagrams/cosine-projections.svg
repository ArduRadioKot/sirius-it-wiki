  <text x="575.0" y="260.6" fill="#333333" font-family="Arial,sans-serif" font-size="19" font-weight="700" font-style="italic" text-anchor="middle">H</text>
  <text x="655.0" y="284.0" fill="#5f6e73" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">проекция b на AB</text>
  <text x="655.0" y="302.0" fill="#5f6e73" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">отрицательна: cos α &lt; 0</text>

