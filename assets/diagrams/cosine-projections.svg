<svg xmlns="http://www.w3.org/2000/svg" width="800" height="318" viewBox="0 0 800 318" role="img" aria-labelledby="title desc">
  <title id="title">Формулы проекций в треугольнике</title>
  <desc id="desc">Высота из вершины C делит основание c на проекции b cos α и a cos β. Справа при тупом угле A основание высоты лежит на продолжении стороны, и проекция отрицательна.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#0b7d86"/></marker>
  <marker id="arrowv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7e6fc6"/></marker></defs>
  <rect width="800" height="318" rx="22" fill="#f0f9fb"/>
  <text x="32.0" y="40.0" fill="#07555c" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">c = b cos α + a cos β</text>
  <text x="560.0" y="40.0" fill="#07555c" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Тупой угол α</text>
