<text x="500" y="365" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#17243c" text-anchor="middle">тип 2: 0</text>
<text x="825" y="365" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#17243c" text-anchor="middle">тип 3: 3</text>
