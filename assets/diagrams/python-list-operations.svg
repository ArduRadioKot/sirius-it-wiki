<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Как устроен список Python</title>
  <desc id="desc">Список хранит ссылки в ячейках с запасом. Добавление в свободную ячейку справа быстрое, а вставка в начало сдвигает все занятые ячейки.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#167f8a"/></marker>
    <style>.t{font:700 24px Arial,sans-serif;fill:#183b43}.h{font:700 17px Arial,sans-serif;fill:#183b43}.s{font:15px Arial,sans-serif;fill:#536b70}.v{font:700 19px Arial,sans-serif;fill:#183b43}.i{font:13px Arial,sans-serif;fill:#607b80}</style>
  </defs>
  <rect width="1000" height="390" rx="24" fill="#eff8fa"/>
  <text x="40" y="43" class="t">list — массив ссылок с запасом</text>
  <rect x="34" y="67" width="452" height="288" rx="18" fill="#fff" stroke="#d9e9ed"/>
  <text x="58" y="104" class="h">Индекс вычисляется сразу · O(1)</text>
  <text x="58" y="130" class="s">len = 4, ёмкость = 6</text>
  <g text-anchor="middle">
    <text x="92" y="168" class="i">0</text><text x="156" y="168" class="i">1</text><text x="220" y="168" class="i">2</text><text x="284" y="168" class="i">3</text><text x="348" y="168" class="i">4</text><text x="412" y="168" class="i">5</text>
    <rect x="61" y="178" width="61" height="58" rx="9" fill="#d7f0ed" stroke="#64b9b0"/><rect x="125" y="178" width="61" height="58" rx="9" fill="#d7f0ed" stroke="#64b9b0"/><rect x="189" y="178" width="61" height="58" rx="9" fill="#d7f0ed" stroke="#64b9b0"/><rect x="253" y="178" width="61" height="58" rx="9" fill="#d7f0ed" stroke="#64b9b0"/>
    <rect x="317" y="178" width="61" height="58" rx="9" fill="#f2f5f6" stroke="#b8cbd0" stroke-dasharray="5 4"/><rect x="381" y="178" width="61" height="58" rx="9" fill="#f2f5f6" stroke="#b8cbd0" stroke-dasharray="5 4"/>
    <text x="92" y="214" class="v">A</text><text x="156" y="214" class="v">B</text><text x="220" y="214" class="v">C</text><text x="284" y="214" class="v">D</text>
  </g>
  <path d="M347 251v36" stroke="#167f8a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="232" y="318" class="s">append(E): занять свободную ячейку</text>
  <rect x="514" y="67" width="452" height="288" rx="18" fill="#fff" stroke="#d9e9ed"/>
  <text x="538" y="104" class="h">Вставка в начало · O(n)</text>
  <text x="538" y="130" class="s">До вставки:</text>
  <g text-anchor="middle">
    <rect x="539" y="146" width="73" height="56" rx="9" fill="#d7f0ed"/><rect x="616" y="146" width="73" height="56" rx="9" fill="#d7f0ed"/><rect x="693" y="146" width="73" height="56" rx="9" fill="#d7f0ed"/><rect x="770" y="146" width="73" height="56" rx="9" fill="#d7f0ed"/><rect x="847" y="146" width="73" height="56" rx="9" fill="#f2f5f6" stroke="#b8cbd0" stroke-dasharray="5 4"/>
    <text x="575" y="181" class="v">A</text><text x="652" y="181" class="v">B</text><text x="729" y="181" class="v">C</text><text x="806" y="181" class="v">D</text>
  </g>
  <path d="M575 207 646 240M652 207 723 240M729 207 800 240M806 207 877 240" fill="none" stroke="#d79655" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g text-anchor="middle">
    <rect x="539" y="250" width="73" height="56" rx="9" fill="#ffe2bd" stroke="#d79655"/><rect x="616" y="250" width="73" height="56" rx="9" fill="#d7f0ed"/><rect x="693" y="250" width="73" height="56" rx="9" fill="#d7f0ed"/><rect x="770" y="250" width="73" height="56" rx="9" fill="#d7f0ed"/><rect x="847" y="250" width="73" height="56" rx="9" fill="#d7f0ed"/>
    <text x="575" y="286" class="v">X</text><text x="652" y="286" class="v">A</text><text x="729" y="286" class="v">B</text><text x="806" y="286" class="v">C</text><text x="883" y="286" class="v">D</text>
  </g>
  <text x="538" y="335" class="s">Четыре ссылки пришлось передвинуть.</text>
</svg>
