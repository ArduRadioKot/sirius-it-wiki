<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="title desc">
  <title id="title">Три последовательных отражения</title>
  <desc id="desc">Первое отражение совмещает A с A штрих, второе совмещает B с B штрих и сохраняет A штрих, третье совмещает C с C штрих и сохраняет первые две вершины.</desc>
  <rect width="760" height="290" rx="22" fill="#f0f9fb"/>
  <g font-family="Arial,sans-serif">
    <rect x="30" y="75" width="210" height="140" rx="18" fill="#e6e2f6" stroke="#7e6fc6" stroke-width="3"/>
    <rect x="275" y="75" width="210" height="140" rx="18" fill="#d7eef0" stroke="#0b7d86" stroke-width="3"/>
    <rect x="520" y="75" width="210" height="140" rx="18" fill="#e5f4eb" stroke="#4d9f78" stroke-width="3"/>
    <g fill="#173c43" font-size="21" font-weight="700" text-anchor="middle"><text x="135" y="115">Отражение 1</text><text x="380" y="115">Отражение 2</text><text x="625" y="115">Отражение 3</text></g>
    <g fill="#46666c" font-size="17" text-anchor="middle"><text x="135" y="153">A → A′</text><text x="380" y="153">B₁ → B′</text><text x="625" y="153">C₂ → C′</text><text x="135" y="185">Исправили A</text><text x="380" y="185">Сохранили A′</text><text x="625" y="185">Сохранили A′, B′</text></g>
  </g>
  <path d="M245 145h22M490 145h22" stroke="#07555c" stroke-width="4" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#07555c"/></marker></defs>
  <g fill="#536d73" font-family="Arial,sans-serif" font-size="17" text-anchor="middle"><text x="380" y="42">Каждый шаг нужен лишь при несовпадении соответствующих точек</text><text x="380" y="254">Результат: S₃ ∘ S₂ ∘ S₁</text></g>
</svg>
