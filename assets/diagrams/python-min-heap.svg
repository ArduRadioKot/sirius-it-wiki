<svg xmlns="http://www.w3.org/2000/svg" width="900" height="425" viewBox="0 0 900 425" role="img" aria-labelledby="title desc">
  <title id="title">Минимальная куча и её хранение в списке</title>
  <desc id="desc">Минимальная куча с вершиной 1, детьми 3 и 2, а также листьями 7, 4, 5, 8. В списке элементы расположены по уровням: 1, 3, 2, 7, 4, 5, 8.</desc>
  <defs><style>.t{font:700 24px Arial,sans-serif;fill:#183b43}.h{font:700 17px Arial,sans-serif;fill:#183b43}.s{font:15px Arial,sans-serif;fill:#526b70}.v{font:700 22px Arial,sans-serif;fill:#183b43}</style></defs>
  <rect width="900" height="425" rx="24" fill="#eff8fa"/>
  <text x="40" y="43" class="t">heapq — минимум всегда наверху</text>
  <rect x="35" y="65" width="830" height="320" rx="18" fill="#fff" stroke="#d9e9ed"/>
  <g stroke="#92abb0" stroke-width="3"><path d="M450 113 300 180M450 113 600 180M300 195 200 264M300 195 390 264M600 195 510 264M600 195 700 264"/></g>
  <g text-anchor="middle"><circle cx="450" cy="112" r="30" fill="#ffe2bd" stroke="#d79655" stroke-width="2"/><circle cx="300" cy="190" r="29" fill="#d7f0ed" stroke="#64b9b0" stroke-width="2"/><circle cx="600" cy="190" r="29" fill="#d7f0ed" stroke="#64b9b0" stroke-width="2"/><circle cx="200" cy="267" r="28" fill="#e6e0f4"/><circle cx="390" cy="267" r="28" fill="#e6e0f4"/><circle cx="510" cy="267" r="28" fill="#e6e0f4"/><circle cx="700" cy="267" r="28" fill="#e6e0f4"/>
    <text x="450" y="120" class="v">1</text><text x="300" y="197" class="v">3</text><text x="600" y="197" class="v">2</text><text x="200" y="274" class="v">7</text><text x="390" y="274" class="v">4</text><text x="510" y="274" class="v">5</text><text x="700" y="274" class="v">8</text>
  </g>
  <text x="74" y="113" class="h">min = heap[0]</text><text x="75" y="137" class="s">доступ · O(1)</text><text x="668" y="114" class="s">родитель ≤ дети</text>
  <text x="450" y="345" class="h" text-anchor="middle">В памяти: [1, 3, 2, 7, 4, 5, 8]</text>
  <text x="450" y="370" class="s" text-anchor="middle">push / pop · O(log n)   |   heapify · O(n)</text>
</svg>
