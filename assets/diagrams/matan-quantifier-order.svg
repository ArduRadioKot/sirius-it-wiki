<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Порядок кванторов</title><desc id="desc">Слева y зависит от x, справа один y должен подойти всем</desc><rect width="1000" height="440" fill="#fbfaf6"/>
<text x="45" y="58" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#17243c" text-anchor="start">Порядок кванторов меняет смысл</text>
<text x="45" y="91" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#546276" text-anchor="start">Работаем на целых числах</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546276"/></marker></defs>
<rect x="50" y="125" width="430" height="235" rx="18" fill="#e1f3f0" stroke="none" stroke-width="2"/>
<rect x="520" y="125" width="430" height="235" rx="18" fill="#fdebe7" stroke="none" stroke-width="2"/>
<text x="80" y="174" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#137e87" text-anchor="start">∀x ∃y: y &gt; x</text>
<text x="550" y="174" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#d35943" text-anchor="start">∃y ∀x: y &gt; x</text>
<text x="85" y="220" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#17243c" text-anchor="start">x=0  →  y=1</text>
<text x="85" y="260" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#17243c" text-anchor="start">x=1  →  y=2</text>
<text x="85" y="300" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#17243c" text-anchor="start">x=2  →  y=3</text>
<text x="555" y="225" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#17243c" text-anchor="start">Один y для всех x?</text>
<text x="555" y="272" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#17243c" text-anchor="start">Возьми x=y+1.</text>
<text x="555" y="317" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#d35943" text-anchor="start">Получаем противоречие.</text>
</svg>