<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
  <title id="title">Теорема Менелая</title>
  <desc id="desc">Прямая пересекает стороны AB и AC в точках C₁ и B₁ и продолжение стороны BC в точке A₁. Из вершин опущены перпендикуляры h₁, h₂, h₃ на эту прямую.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#0b7d86"/></marker>
  <marker id="arrowv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7e6fc6"/></marker></defs>
  <rect width="900" height="310" rx="22" fill="#f0f9fb"/>
  <text x="32.0" y="40.0" fill="#07555c" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Прямая Менелая</text>
  <path d="M430.0 262.0 605.8 262.0" stroke="#5f6e73" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="6 6"/>
  <path d="M250.0 70.0 90.0 262.0 430.0 262.0Z" fill="#e6e2f6" stroke="#7e6fc6" stroke-width="3" stroke-linejoin="round"/>
  <path d="M95.8 127.7 630.9 268.6" stroke="#0b7d86" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M250.0 70.0 225.8 162.0" stroke="#7e6fc6" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4 5"/>
  <path d="M228.3 152.3 238.0 154.8 235.5 164.5" stroke="#7e6fc6" stroke-width="2" fill="none"/>
  <text x="251.9" y="121.6" fill="#7e6fc6" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">h₁</text>
  <path d="M430.0 262.0 441.4 218.7" stroke="#7e6fc6" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4 5"/>
  <path d="M438.8 228.4 448.5 230.9 451.1 221.3" stroke="#7e6fc6" stroke-width="2" fill="none"/>
  <text x="449.7" y="246.0" fill="#7e6fc6" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">h₂</text>
  <path d="M90.0 262.0 123.4 135.0" stroke="#7e6fc6" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4 5"/>
  <path d="M120.9 144.7 130.6 147.2 133.1 137.6" stroke="#7e6fc6" stroke-width="2" fill="none"/>
  <text x="120.7" y="204.1" fill="#7e6fc6" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">h₃</text>
  <circle cx="605.8" cy="262.0" r="5.5" fill="#0b7d86"/>
  <circle cx="372.4" cy="200.6" r="5.5" fill="#0b7d86"/>
  <circle cx="182.8" cy="150.6" r="5.5" fill="#0b7d86"/>
  <text x="248.9" y="54.7" fill="#333333" font-family="Arial,sans-serif" font-size="19" font-weight="700" font-style="italic" text-anchor="middle">A</text>
  <text x="69.5" y="276.5" fill="#333333" font-family="Arial,sans-serif" font-size="19" font-weight="700" font-style="italic" text-anchor="middle">B</text>
  <text x="430.0" y="292.6" fill="#333333" font-family="Arial,sans-serif" font-size="19" font-weight="700" font-style="italic" text-anchor="middle">C</text>
  <text x="605.8" y="292.6" fill="#333333" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">A₁</text>
  <text x="378.4" y="185.2" fill="#333333" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">B₁</text>
  <text x="156.8" y="153.3" fill="#333333" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">C₁</text>
  <text x="745.0" y="110.0" fill="#333333" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Точки A₁, B₁, C₁ на одной</text>
  <text x="745.0" y="130.0" fill="#333333" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">прямой тогда и только тогда, когда</text>
  <text x="745.0" y="172.0" fill="#07555c" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">AC₁/C₁B · BA₁/A₁C · CB₁/B₁A = 1</text>
  <text x="745.0" y="206.0" fill="#5f6e73" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Каждое отношение равно</text>
  <text x="745.0" y="226.0" fill="#5f6e73" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">отношению высот h, и они сокращаются</text>

</svg>
