<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Трение покоя и трение скольжения</title><desc id="desc">Трение покоя растёт с приложенной силой до предела, затем при скольжении приблизительно постоянно</desc><rect width="1000" height="470" fill="#fbfaf6"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<text x="42" y="60" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#17243c" text-anchor="start">Два режима трения</text>
<text x="42" y="95" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#546276" text-anchor="start">Трение покоя подстраивается под F; при скольжении используют μk N</text>
<line x1="105" y1="390" x2="920" y2="390" stroke="#17243c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="105" y1="390" x2="105" y2="130" stroke="#17243c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="900" y="430" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#17243c" text-anchor="end">Приложенная сила F</text>
<text x="44" y="131" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#17243c" text-anchor="start">Fтр</text>
<line x1="105" y1="390" x2="565" y2="175" stroke="#315fc0" stroke-width="5" stroke-linecap="round"/>
<circle cx="565" cy="175" r="7" fill="#315fc0" stroke="none" stroke-width="2"/>
<line x1="565" y1="175" x2="565" y2="244" stroke="#d35943" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7"/>
<line x1="565" y1="244" x2="880" y2="244" stroke="#d35943" stroke-width="5" stroke-linecap="round"/>
<line x1="565" y1="175" x2="565" y2="390" stroke="#546276" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7"/>
<text x="555" y="155" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#315fc0" text-anchor="end">μs N</text>
<text x="885" y="238" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#d35943" text-anchor="start">μk N</text>
<text x="300" y="245" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#315fc0" text-anchor="start">покой</text>
<text x="680" y="280" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#d35943" text-anchor="start">скольжение</text>
</svg>