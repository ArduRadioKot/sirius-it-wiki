<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Равномощность натуральных и целых чисел</title><desc id="desc">Последовательность целых 0, 1, минус 1, 2, минус 2 соответствует натуральным индексам</desc><rect width="1000" height="440" fill="#fbfaf6"/>
<text x="45" y="58" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#17243c" text-anchor="start">Биекция между ℕ и ℤ</text>
<text x="45" y="91" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#546276" text-anchor="start">Каждому номеру соответствует одно целое</text>
