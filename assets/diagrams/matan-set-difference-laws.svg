<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Законы для разности множеств</title>
  <desc id="desc">Отрицание объединения требует не входить ни в B, ни в C; отрицание пересечения требует не входить хотя бы в одно из них.</desc>
  <rect width="1000" height="460" fill="#fbfaf6"/>
  <text x="46" y="60" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#17243c">Разность и законы де Моргана</text>
  <text x="46" y="96" font-family="Arial, sans-serif" font-size="21" fill="#546276">Сначала оставляем элементы A, затем проверяем условие про B и C</text>
  <rect x="42" y="130" width="440" height="272" rx="22" fill="#e1f3f0"/>
  <rect x="518" y="130" width="440" height="272" rx="22" fill="#fdebe7"/>
  <text x="70" y="186" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#137e87">A \ (B ∪ C)</text>
  <text x="546" y="186" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#d35943">A \ (B ∩ C)</text>
  <text x="70" y="238" font-family="Arial, sans-serif" font-size="23" fill="#17243c">x ∈ A</text>
  <text x="70" y="274" font-family="Arial, sans-serif" font-size="23" fill="#17243c">x ∉ B  И  x ∉ C</text>
  <text x="546" y="238" font-family="Arial, sans-serif" font-size="23" fill="#17243c">x ∈ A</text>
  <text x="546" y="274" font-family="Arial, sans-serif" font-size="23" fill="#17243c">x ∉ B  ИЛИ  x ∉ C</text>
  <rect x="68" y="318" width="386" height="59" rx="14" fill="#fff"/>
  <rect x="544" y="318" width="386" height="59" rx="14" fill="#fff"/>
  <text x="88" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#137e87">(A \ B) ∩ (A \ C)</text>
  <text x="564" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#d35943">(A \ B) ∪ (A \ C)</text>
</svg>
