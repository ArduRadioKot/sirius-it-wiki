<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Выбор формулы подсчёта</title><desc id="desc">Два вопроса: важен ли порядок и разрешены ли повторения</desc><rect width="1000" height="440" fill="#fbfaf6"/>
<text x="45" y="58" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#17243c" text-anchor="start">Как выбрать формулу?</text>
<text x="45" y="91" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#546276" text-anchor="start">Для k позиций и n объектов</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546276"/></marker></defs>
<rect x="310" y="110" width="380" height="65" rx="18" fill="#e4eefb" stroke="none" stroke-width="2"/>
<text x="500" y="153" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#315fc0" text-anchor="middle">Важен порядок?</text>
<rect x="60" y="220" width="400" height="170" rx="18" fill="#e1f3f0" stroke="none" stroke-width="2"/>
<text x="260" y="267" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#137e87" text-anchor="middle">Да</text>
<rect x="540" y="220" width="400" height="170" rx="18" fill="#fdebe7" stroke="none" stroke-width="2"/>
<text x="740" y="267" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#d35943" text-anchor="middle">Нет</text>
<line x1="420" y1="175" x2="250" y2="220" stroke="#546276" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="580" y1="175" x2="750" y2="220" stroke="#546276" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="90" y="315" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#17243c" text-anchor="start">Повторы: n^k</text>
<text x="90" y="355" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#17243c" text-anchor="start">Без повторов: A(n,k)</text>
<text x="570" y="315" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#17243c" text-anchor="start">Повторы: C(n+k−1,k)</text>
<text x="570" y="355" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#17243c" text-anchor="start">Без повторов: C(n,k)</text>
</svg>