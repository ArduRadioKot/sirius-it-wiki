<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Включения и исключения для двух множеств</title><desc id="desc">Общее пересечение было посчитано дважды</desc><rect width="1000" height="440" fill="#fbfaf6"/>
<text x="45" y="58" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#17243c" text-anchor="start">Два множества</text>
<text x="45" y="91" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#546276" text-anchor="start">|A ∪ B| = |A| + |B| − |A ∩ B|</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546276"/></marker></defs>
<circle cx="400" cy="235" r="125" fill="#b9e2dc" stroke="#137e87" stroke-width="3"/>
<circle cx="600" cy="235" r="125" fill="#f3c5b9" stroke="#d35943" stroke-width="3"/>
<text x="335" y="245" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#17243c" text-anchor="middle">A</text>
<text x="665" y="245" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#17243c" text-anchor="middle">B</text>
<text x="500" y="245" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#17243c" text-anchor="middle">A ∩ B</text>
<text x="500" y="404" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#546276" text-anchor="middle">Общую часть вычитаем один раз</text>
</svg>