<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Композиция отношений</title><desc id="desc">Существует промежуточное b, соединяющее a с c</desc><rect width="1000" height="440" fill="#fbfaf6"/>
<text x="45" y="58" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#17243c" text-anchor="start">Композиция отношений</text>
<text x="45" y="91" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#546276" text-anchor="start">a R b и b S c  ⇒  a (S∘R) c</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546276"/></marker></defs>
<circle cx="170" cy="240" r="55" fill="white" stroke="#315fc0" stroke-width="4"/>
<text x="170" y="252" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#17243c" text-anchor="middle">a</text>
<circle cx="500" cy="240" r="55" fill="white" stroke="#137e87" stroke-width="4"/>
<text x="500" y="252" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#17243c" text-anchor="middle">b</text>
<circle cx="830" cy="240" r="55" fill="white" stroke="#d35943" stroke-width="4"/>
<text x="830" y="252" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#17243c" text-anchor="middle">c</text>
<line x1="225" y1="240" x2="445" y2="240" stroke="#315fc0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="555" y1="240" x2="775" y2="240" stroke="#137e87" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="335" y="210" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#315fc0" text-anchor="middle">R</text>
<text x="665" y="210" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#137e87" text-anchor="middle">S</text>
<text x="500" y="365" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#546276" text-anchor="middle">Достаточно хотя бы одного такого пути</text>
</svg>