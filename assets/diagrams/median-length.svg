<svg xmlns="http://www.w3.org/2000/svg" width="820" height="316" viewBox="0 0 820 316" role="img" aria-labelledby="title desc">
  <title id="title">Формула длины медианы</title>
  <desc id="desc">Медиана AM делит сторону BC пополам. Углы при точке M равны φ и 180° − φ, поэтому слагаемые с косинусом при сложении сокращаются.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#0b7d86"/></marker>
  <marker id="arrowv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7e6fc6"/></marker></defs>
  <rect width="820" height="316" rx="22" fill="#f0f9fb"/>
  <text x="32.0" y="40.0" fill="#07555c" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Медиана делит треугольник на два</text>
  <path d="M330.0 82.0 110.0 252.0 630.0 252.0Z" fill="#e6e2f6" stroke="#7e6fc6" stroke-width="3" stroke-linejoin="round"/>
  <path d="M330.0 82.0 370.0 252.0" stroke="#0b7d86" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="370.0" cy="252.0" r="5" fill="#0b7d86"/>
  <path d="M400.0 252.0 A30 30 0 0 0 363.1 222.8" stroke="#0b7d86" stroke-width="2.2" fill="none"/>
  <path d="M359.9 209.2 A44 44 0 0 0 326.0 252.0" stroke="#7e6fc6" stroke-width="2.2" fill="none"/>
  <text x="402.3" y="217.5" fill="#0b7d86" font-family="Arial,sans-serif" font-size="18" font-weight="700" font-style="italic" text-anchor="middle">φ</text>
  <text x="309.1" y="214.1" fill="#7e6fc6" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">180° − φ</text>
  <text x="325.0" y="67.2" fill="#333333" font-family="Arial,sans-serif" font-size="19" font-weight="700" font-style="italic" text-anchor="middle">A</text>
  <text x="88.6" y="263.6" fill="#333333" font-family="Arial,sans-serif" font-size="19" font-weight="700" font-style="italic" text-anchor="middle">B</text>
  <text x="651.5" y="263.1" fill="#333333" font-family="Arial,sans-serif" font-size="19" font-weight="700" font-style="italic" text-anchor="middle">C</text>
  <text x="370.0" y="282.6" fill="#333333" font-family="Arial,sans-serif" font-size="19" font-weight="700" font-style="italic" text-anchor="middle">M</text>
  <text x="198.0" y="167.7" fill="#302268" font-family="Arial,sans-serif" font-size="19" font-weight="700" font-style="italic" text-anchor="middle">c</text>
  <text x="500.0" y="165.7" fill="#302268" font-family="Arial,sans-serif" font-size="19" font-weight="700" font-style="italic" text-anchor="middle">b</text>
  <text x="322.0" y="182.2" fill="#0b7d86" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">mₐ</text>
  <text x="240.0" y="288.0" fill="#302268" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">a/2</text>
  <text x="500.0" y="288.0" fill="#302268" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">a/2</text>
  <text x="720.0" y="120.0" fill="#5f6e73" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Складываем две</text>
  <text x="720.0" y="140.0" fill="#5f6e73" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">теоремы косинусов:</text>
  <text x="720.0" y="178.0" fill="#07555c" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">b² + c² =</text>
  <text x="720.0" y="204.0" fill="#07555c" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">2mₐ² + a²/2</text>

</svg>
