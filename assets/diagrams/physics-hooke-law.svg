<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">График закона Гука</title><desc id="desc">В упругой области сила пропорциональна удлинению, за её пределами график не продолжен</desc><rect width="1000" height="470" fill="#fbfaf6"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs>
<text x="42" y="60" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#17243c" text-anchor="start">Закон Гука</text>
<text x="42" y="95" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#546276" text-anchor="start">Наклон графика F(Δℓ) равен жёсткости k</text>
<line x1="110" y1="390" x2="900" y2="390" stroke="#17243c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="110" y1="390" x2="110" y2="125" stroke="#17243c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="900" y="420" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#17243c" text-anchor="end">Δℓ</text>
<text x="80" y="135" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#17243c" text-anchor="start">F</text>
<rect x="690" y="130" width="180" height="255" rx="18" fill="#f3ece6" stroke="none" stroke-width="2"/>
<line x1="110" y1="390" x2="690" y2="155" stroke="#137e87" stroke-width="5" stroke-linecap="round"/>
<line x1="690" y1="150" x2="690" y2="391" stroke="#d35943" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 8"/>
<text x="760" y="191" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#d35943" text-anchor="middle">За пределами</text>
<text x="760" y="222" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#d35943" text-anchor="middle">упругой области</text>
<text x="350" y="252" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#137e87" text-anchor="start">F = k·Δℓ</text>
<text x="155" y="443" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#17243c" text-anchor="start">0</text>
</svg>