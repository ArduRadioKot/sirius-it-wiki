<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Классы эквивалентности по модулю три</title><desc id="desc">Каждое целое число попадает ровно в один из трёх классов</desc><rect width="1000" height="440" fill="#fbfaf6"/>
<text x="45" y="58" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#17243c" text-anchor="start">Классы по остатку при делении на 3</text>
<text x="45" y="91" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#546276" text-anchor="start">Разбиение целых чисел</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546276"/></marker></defs>
<rect x="40" y="135" width="295" height="210" rx="18" fill="#e1f3f0" stroke="none" stroke-width="2"/>
<text x="187" y="195" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#17243c" text-anchor="middle">[0]</text>
<text x="187" y="275" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#17243c" text-anchor="middle">… −6, −3, 0, 3, 6 …</text>
<rect x="360" y="135" width="295" height="210" rx="18" fill="#e4eefb" stroke="none" stroke-width="2"/>
<text x="507" y="195" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#17243c" text-anchor="middle">[1]</text>
<text x="507" y="275" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#17243c" text-anchor="middle">… −5, −2, 1, 4, 7 …</text>
<rect x="680" y="135" width="295" height="210" rx="18" fill="#fdebe7" stroke="none" stroke-width="2"/>
<text x="827" y="195" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#17243c" text-anchor="middle">[2]</text>
<text x="827" y="275" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#17243c" text-anchor="middle">… −4, −1, 2, 5, 8 …</text>
</svg>