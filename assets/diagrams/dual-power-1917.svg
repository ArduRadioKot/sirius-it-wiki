<svg xmlns="http://www.w3.org/2000/svg" width="800" height="285" viewBox="0 0 800 285" role="img" aria-labelledby="title desc">
  <title id="title">Двоевластие в 1917 году</title>
  <desc id="desc">После падения монархии параллельно действовали два органа власти: Временное правительство и Петроградский совет.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#0b7d86"/></marker>
  <marker id="arrowv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7e6fc6"/></marker></defs>
  <rect width="800" height="285" rx="22" fill="#f0f9fb"/>
  <text x="32.0" y="40.0" fill="#07555c" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Двоевластие, 1917 год</text>
  <rect x="250" y="66" width="300" height="54" rx="14" fill="#ffffff" stroke="#8bcbd4" stroke-width="2"/>
  <text x="400.0" y="90.0" fill="#333333" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Власть в России</text>
  <text x="400.0" y="111.0" fill="#5f6e73" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">после падения монархии</text>
  <path d="M330 120 V145.0 H190 V168" stroke="#0b7d86" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M470 120 V145.0 H610 V168" stroke="#7e6fc6" stroke-width="2.5" fill="none" marker-end="url(#arrowv)"/>
  <rect x="60" y="170" width="260" height="62" rx="14" fill="#d6f1f5" stroke="#0b7d86" stroke-width="2"/>
  <text x="190.0" y="207.0" fill="#07555c" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Временное правительство</text>
  <rect x="480" y="170" width="260" height="62" rx="14" fill="#e6e2f6" stroke="#7e6fc6" stroke-width="2"/>
  <text x="610.0" y="207.0" fill="#302268" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Петроградский совет</text>
  <text x="400.0" y="192.0" fill="#5f6e73" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">параллельно</text>
  <path d="M330.0 206.0 470.0 206.0" stroke="#5f6e73" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-dasharray="5 5"/>
  <text x="190.0" y="258.0" fill="#5f6e73" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">глава с июля 1917 — А. Ф. Керенский</text>
  <text x="610.0" y="258.0" fill="#5f6e73" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">опора на рабочих и солдат</text>

</svg>
