name: Deploy Sirius Wiki to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch university schedule
        id: schedule
        continue-on-error: true
        run: python3 scripts/update-schedule.py

      - name: Report schedule update failure
        if: steps.schedule.outcome == 'failure'
        run: echo "::warning::Schedule source unavailable. Deploying the last successful snapshot; its original timestamp is preserved."

      - name: Build Markdown index
        run: node generate-index.mjs

      - name: Save generated content index
        run: |
          if git diff --quiet -- content-index.json data/schedule.json; then
            echo "content-index.json is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content-index.json data/schedule.json
            git commit -m "chore: update content and schedule [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Could not push content-index.json; deployment will still use the generated index."
          fi

      - name: Version offline application
        run: node scripts/version-worker.mjs

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='tmp' \
            --exclude='output' \
            --exclude='tests' \
            --exclude='scripts' \
            ./ _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
